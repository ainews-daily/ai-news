<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 新鲜事</title>
<style>
  :root {
    --bg: #f6f7fb;
    --surface: #ffffff;
    --surface-2: #eef0f6;
    --text: #161a24;
    --muted: #5d6475;
    --border: #e1e4ee;
    --accent: #5b5bf0;
    --accent-2: #b14de8;
    --spot: rgba(91, 91, 240, 0.10);
    --shadow: 0 1px 2px rgba(20, 24, 40, .04), 0 4px 16px rgba(20, 24, 40, .05);
    --c-model: #2f6fea;
    --c-industry: #d9711c;
    --c-research: #0f9d74;
    --c-tools: #b03fd6;
    --c-warn: #d23c3c;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c0e14;
      --surface: #151822;
      --surface-2: #1d2130;
      --text: #e8eaf2;
      --muted: #969cb0;
      --border: #262b3b;
      --accent: #8b8bff;
      --accent-2: #d58bff;
      --spot: rgba(139, 139, 255, 0.13);
      --shadow: none;
      --c-model: #6f9dff;
      --c-industry: #f0a35e;
      --c-research: #4fd1a5;
      --c-tools: #d58bff;
      --c-warn: #ff7b7b;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0c0e14;
    --surface: #151822;
    --surface-2: #1d2130;
    --text: #e8eaf2;
    --muted: #969cb0;
    --border: #262b3b;
    --accent: #8b8bff;
    --accent-2: #d58bff;
    --spot: rgba(139, 139, 255, 0.13);
    --shadow: none;
    --c-model: #6f9dff;
    --c-industry: #f0a35e;
    --c-research: #4fd1a5;
    --c-tools: #d58bff;
    --c-warn: #ff7b7b;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.65 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }

  .layout {
    max-width: 1180px;
    margin: 0 auto;
    padding: 32px 24px 64px;
    display: grid;
    grid-template-columns: 216px minmax(0, 1fr);
    gap: 40px;
  }

  /* 日期列表 */
  .dates { position: sticky; top: 32px; align-self: start; }
  .dates h2 { font-size: 12px; font-weight: 600; letter-spacing: .08em; color: var(--muted); margin: 0 0 12px; }
  /* 设计、工具库的日期分组 */
  .group-head { display: flex; align-items: center; gap: 8px; margin: 28px 0 12px; font-size: 15px; font-variant-numeric: tabular-nums; }
  .count + .group-head { margin-top: 4px; }
  .group-count { color: var(--muted); font-size: 13px; font-weight: 500; }
  .group-new { padding: 1px 8px; border-radius: 6px; font-size: 12px; color: var(--accent); background: color-mix(in srgb, var(--accent) 13%, transparent); }
  .load-more {
    display: block; width: 100%; max-width: 360px; margin: 24px auto 0; padding: 11px 16px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--surface); color: var(--accent);
    font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; box-shadow: var(--shadow);
  }
  .load-more:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); }

  /* 右下角浮动按钮：版块目录（手机）、回到顶部 */
  .fab { position: fixed; right: 20px; bottom: 24px; z-index: 25; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
  .fab-btn {
    width: 44px; height: 44px; display: grid; place-items: center; padding: 0;
    border: 1px solid var(--border); border-radius: 50%; background: var(--surface); color: var(--text); cursor: pointer;
    box-shadow: 0 4px 16px rgba(20, 24, 40, .14); -webkit-tap-highlight-color: transparent;
  }
  .fab-btn svg { width: 20px; height: 20px; }
  .to-top { opacity: 0; transform: translateY(12px); pointer-events: none; transition: opacity .2s, transform .2s; }
  .to-top.show { opacity: 1; transform: none; pointer-events: auto; }

  /* 手机端才用的顶栏、底部导航图标、遮罩，桌面隐藏 */
  .date-btn, .tab-ico, .backdrop, .nav-btn { display: none; }

  /* 月历：有日报的日子可点，带小圆点 */
  .cal { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px; box-shadow: var(--shadow); }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .cal-title { font-size: 13.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .cal-nav {
    width: 26px; height: 26px; border: 0; border-radius: 7px; background: none; color: var(--muted);
    font: inherit; font-size: 16px; line-height: 1; cursor: pointer;
  }
  .cal-nav:hover:not(:disabled) { background: var(--surface-2); color: var(--text); }
  .cal-nav:disabled { opacity: .3; cursor: default; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; font-variant-numeric: tabular-nums; }
  .cal-wd { font-size: 11px; color: var(--muted); padding-bottom: 4px; }
  .cal-day {
    position: relative; display: grid; place-items: center; aspect-ratio: 1; border-radius: 7px;
    font-size: 12.5px; color: var(--muted); opacity: .45; text-decoration: none;
  }
  a.cal-day { opacity: 1; color: var(--text); font-weight: 600; }
  a.cal-day::after {
    content: ""; position: absolute; left: 50%; bottom: 3px; width: 4px; height: 4px; margin-left: -2px;
    border-radius: 50%; background: var(--accent);
  }
  a.cal-day:hover { background: var(--surface-2); }
  .cal-day.today { box-shadow: inset 0 0 0 1px var(--border); }
  a.cal-day[aria-current="true"] { background: var(--accent); color: #fff; }
  a.cal-day[aria-current="true"]::after { background: #fff; }
  .cal-foot { margin-top: 8px; font-size: 12px; color: var(--muted); text-align: center; }

  /* 标题：逐字模糊浮现 */
  header.top { margin-bottom: 28px; }
  .title { font-size: 40px; line-height: 1.15; font-weight: 800; margin: 0; letter-spacing: -.01em; }
  .title span { display: inline-block; opacity: 0; filter: blur(10px); transform: translateY(-12px); animation: blur-in .7s cubic-bezier(.2,.7,.2,1) forwards; animation-delay: calc(var(--i) * 70ms); }
  @keyframes blur-in { to { opacity: 1; filter: blur(0); transform: none; } }
  .subtitle { color: var(--muted); margin: 6px 0 0; }

  /* 今日看点：流光标题 */
  .highlights {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 20px 24px; margin-bottom: 28px; box-shadow: var(--shadow);
  }
  .shiny {
    font-size: 13px; font-weight: 700; letter-spacing: .1em; margin: 0 0 10px;
    background: linear-gradient(110deg, var(--accent) 35%, var(--accent-2) 50%, var(--accent) 65%);
    background-size: 250% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shine 4s linear infinite;
  }
  @keyframes shine { from { background-position: 100% 0; } to { background-position: -150% 0; } }
  .highlights ol { margin: 0; padding-left: 1.3em; }
  .highlights li { margin: 4px 0; }
  .highlights li::marker { color: var(--accent); font-weight: 700; }

  /* 筛选 */
  .filters { display: flex; flex-wrap: wrap; gap: 10px 20px; margin-bottom: 18px; }
  .chip-group { display: flex; flex-wrap: wrap; gap: 6px; }
  .jump { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 18px 0 4px; }
  .jump-label { color: var(--muted); font-size: 13px; margin-right: 4px; }
  .chip {
    font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface); color: var(--muted);
    transition: background .15s, color .15s, border-color .15s;
  }
  .chip:hover { color: var(--text); }
  .chip[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: var(--bg); }
  .count { color: var(--muted); font-size: 13px; margin: 0 0 14px; }

  /* 新闻卡片：鼠标跟随光斑 */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .card {
    position: relative; overflow: hidden;
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 18px 20px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; gap: 8px;
    opacity: 0; transform: translateY(14px);
    animation: rise .5s cubic-bezier(.2,.7,.2,1) forwards; animation-delay: calc(var(--i) * 45ms);
    transition: border-color .2s;
  }
  @keyframes rise { to { opacity: 1; transform: none; } }
  .card::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .3s;
    background: radial-gradient(420px circle at var(--mx, 50%) var(--my, 50%), var(--spot), transparent 60%);
  }
  .card:hover::before { opacity: 1; }
  .card:hover { border-color: color-mix(in srgb, var(--accent) 35%, var(--border)); }
  .tags { display: flex; gap: 6px; align-items: center; font-size: 12px; }
  .tag { padding: 1px 8px; border-radius: 6px; font-weight: 600; }
  .tag.cat { color: var(--c); background: color-mix(in srgb, var(--c) 13%, transparent); }
  .tag.region { color: var(--muted); background: var(--surface-2); }
  .card h3 { margin: 0; font-size: 16.5px; line-height: 1.45; }
  .card h3 a { text-decoration: none; }
  .card h3 a:hover { color: var(--accent); }
  .card p { margin: 0; color: var(--muted); font-size: 14px; }
  .source { margin-top: auto; padding-top: 4px; font-size: 12.5px; color: var(--muted); }
  .source a { color: var(--accent); text-decoration: none; }
  .source a:hover { text-decoration: underline; }

  .notice {
    background: var(--surface); border: 1px dashed var(--border); border-radius: 14px;
    padding: 40px 24px; text-align: center; color: var(--muted);
  }
  .notice code { background: var(--surface-2); padding: 2px 6px; border-radius: 5px; color: var(--text); }

  /* 顶部切换：日报 / 工具库 */
  .tabs { display: inline-flex; gap: 4px; padding: 4px; margin-top: 16px; border-radius: 12px; background: var(--surface-2); }
  .tabs a { padding: 6px 16px; border-radius: 9px; text-decoration: none; color: var(--muted); font-size: 14px; font-weight: 600; }
  .tabs a:hover { color: var(--text); }
  .tabs a[aria-current="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

  /* 板块标题 */
  .section { margin-top: 44px; }
  .section-head { display: flex; align-items: baseline; gap: 10px; margin: 0 0 6px; }
  .section-head h2 { margin: 0; font-size: 21px; }
  .section-head span { color: var(--muted); font-size: 13px; }
  .section-desc { color: var(--muted); font-size: 13.5px; margin: 0 0 16px; }

  .tag.kind { color: var(--c); background: color-mix(in srgb, var(--c) 13%, transparent); }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12.5px; color: var(--muted); }

  /* 企业动态：横向条目 */
  .corp-list { display: flex; flex-direction: column; gap: 10px; }
  .corp-list .card { padding: 16px 20px; }

  /* 工具卡片 */
  .app-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
  .app-grid .card { padding: 16px 18px; gap: 6px; }
  .app-grid h3 { font-size: 16px; }
  .app-grid p { font-size: 13.5px; }

  /* 工具库 */
  .hot-box { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
  .hot-list { list-style: none; margin: 0; padding: 0; }
  .hot-row { display: grid; grid-template-columns: 2.6em minmax(0, 1fr); gap: 2px 10px; padding: 11px 16px; border-top: 1px solid var(--border); }
  .hot-row:first-child { border-top: 0; }
  .hot-row:hover { background: var(--surface-2); }
  .hot-rank { grid-row: span 3; color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; padding-top: 2px; }
  .hot-row a { text-decoration: none; font-weight: 600; line-height: 1.5; overflow-wrap: anywhere; }
  .hot-row a:hover { color: var(--accent); }
  .hot-sub { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 12.5px; color: var(--muted); }
  .hot-sub .tag { font-size: 11.5px; }
  .hot-desc { color: var(--muted); font-size: 13px; margin: 2px 0 0; overflow-wrap: anywhere; }
  .more { display: block; width: 100%; padding: 10px; border: 0; border-top: 1px solid var(--border); background: transparent; color: var(--accent); font: inherit; font-size: 13.5px; cursor: pointer; }
  .more:hover { background: var(--surface-2); }
  .status { margin-top: 36px; color: var(--muted); font-size: 13px; }
  .status summary { cursor: pointer; }
  .status ul { margin: 8px 0 0; padding-left: 1.2em; }
  .lib-tools { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin-bottom: 18px; }
  .search {
    font: inherit; font-size: 14px; padding: 7px 14px; border-radius: 999px; width: 220px; max-width: 100%;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
  }
  .search:focus { outline: 2px solid color-mix(in srgb, var(--accent) 50%, transparent); outline-offset: 1px; }

  @media (max-width: 760px) {
    .layout {
      grid-template-columns: minmax(0, 1fr); gap: 0;
      padding: 20px 16px calc(40px + env(safe-area-inset-bottom));
    }

    /* 标题行：右边是日期按钮 */
    .title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .date-btn {
      display: inline-flex; align-items: center; gap: 4px; margin-left: auto; padding: 6px 10px 6px 12px;
      border: 1px solid var(--border); border-radius: 999px; background: var(--surface); color: var(--text);
      font: inherit; font-size: 13.5px; font-weight: 600; font-variant-numeric: tabular-nums; cursor: pointer;
    }
    .date-btn svg { width: 16px; height: 16px; color: var(--muted); }
    .date-btn[hidden] { display: none; }

    /* 日期：底部抽屉 */
    .dates {
      position: fixed; left: 0; right: 0; bottom: 0; top: auto; z-index: 40;
      padding: 10px 16px calc(20px + env(safe-area-inset-bottom));
      background: var(--surface); border-radius: 20px 20px 0 0; box-shadow: 0 -8px 32px rgba(0, 0, 0, .18);
      transform: translateY(105%); transition: transform .3s cubic-bezier(.2,.8,.2,1); visibility: hidden;
    }
    .dates::before { content: ""; display: block; width: 36px; height: 4px; margin: 0 auto 10px; border-radius: 2px; background: var(--border); }
    .dates h2 { text-align: center; font-size: 13px; }
    .sheet-open .dates { transform: none; visibility: visible; }
    .cal { max-width: 380px; margin: 0 auto; padding: 0; border: 0; box-shadow: none; background: none; }
    .cal-day { font-size: 14px; border-radius: 10px; }
    .cal-nav { width: 36px; height: 36px; font-size: 20px; }
    .backdrop {
      display: block; position: fixed; inset: 0; z-index: 35; background: rgba(0, 0, 0, .35);
      opacity: 0; pointer-events: none; transition: opacity .3s;
    }
    .sheet-open .backdrop { opacity: 1; pointer-events: auto; }
    .sheet-open { overflow: hidden; }

    /* 视图切换：固定在底部 */
    .tabs {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; gap: 0; margin: 0;
      transform: translateY(110%); visibility: hidden; transition: transform .28s cubic-bezier(.2,.8,.2,1), visibility .28s;
      padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); border-radius: 0;
      background: color-mix(in srgb, var(--surface) 86%, transparent);
      -webkit-backdrop-filter: blur(16px) saturate(1.5); backdrop-filter: blur(16px) saturate(1.5);
      border-top: 1px solid var(--border);
    }
    .tabs a {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
      padding: 4px 0; font-size: 11px; -webkit-tap-highlight-color: transparent;
    }
    .nav-open .tabs { transform: none; visibility: visible; }
    .nav-open .layout { padding-bottom: calc(84px + env(safe-area-inset-bottom)); }
    .tabs a[aria-current="true"] { background: none; box-shadow: none; color: var(--accent); }
    .tab-ico { display: block; width: 23px; height: 23px; }

    header.top { margin-bottom: 18px; }
    .title { font-size: 30px; }
    .subtitle { font-size: 13.5px; margin-top: 4px; }

    /* 筛选条：单行横向滑动，左右贴边 */
    .filters, .jump, .lib-tools .chip-group {
      flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none;
      margin-left: -16px; margin-right: -16px; padding: 0 16px;
    }
    .filters::-webkit-scrollbar, .jump::-webkit-scrollbar, .chip-group::-webkit-scrollbar { display: none; }
    .filters { gap: 12px; margin-bottom: 14px; }
    .filters .chip-group { flex-wrap: nowrap; flex: none; }
    .jump { margin-top: 14px; margin-bottom: 0; }
    .chip, .jump-label { flex: none; white-space: nowrap; }
    .lib-tools { flex-direction: column; align-items: stretch; gap: 10px; margin-bottom: 14px; }
    .lib-tools .chip-group { order: 2; }
    .search { width: 100%; padding: 9px 14px; }

    /* 卡片收紧 */
    .highlights { padding: 14px 16px; margin-bottom: 4px; border-radius: 14px; }
    .highlights li { margin: 6px 0; line-height: 1.6; }
    .section { margin-top: 32px; scroll-margin-top: 12px; }
    .section-head h2 { font-size: 19px; }
    .section-desc { font-size: 13px; margin-bottom: 12px; }
    .grid, .app-grid { grid-template-columns: minmax(0, 1fr); gap: 10px; }
    .card, .corp-list .card, .app-grid .card { padding: 14px 16px; gap: 6px; border-radius: 12px; }
    .card h3 { font-size: 16px; line-height: 1.45; }
    .card p { font-size: 13.5px; line-height: 1.65; }
    .count { margin-bottom: 10px; }
    .hot-row { padding: 12px 14px; }
    /* 底部导航默认收起，右下角按钮控制显示 / 隐藏；展开时浮动按钮一起往上让 */
    .fab { right: 16px; bottom: calc(20px + env(safe-area-inset-bottom)); transition: bottom .28s cubic-bezier(.2,.8,.2,1); }
    .nav-open .fab { bottom: calc(78px + env(safe-area-inset-bottom)); }
    .nav-btn { display: grid; }
    .nav-btn .ico-close, .nav-open .nav-btn .ico-open { display: none; }
    .nav-open .nav-btn .ico-close { display: block; }
    .group-head { margin: 22px 0 10px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .title span, .card { animation: none; opacity: 1; filter: none; transform: none; }
    .shiny { animation: none; }
  }
</style>
</head>
<body>
<div class="backdrop" id="backdrop"></div>
<div class="fab">
  <button class="fab-btn to-top" id="to-top" type="button" aria-label="回到顶部">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
  </button>
  <button class="fab-btn nav-btn" id="nav-btn" type="button" aria-label="显示导航" aria-expanded="false" aria-controls="tabs">
    <svg class="ico-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg>
    <svg class="ico-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
  </button>
</div>
<div class="layout">
  <nav class="dates" id="dates-nav" aria-label="往期">
    <h2>往期</h2>
    <div class="cal" id="cal"></div>
  </nav>
  <main>
    <header class="top">
      <div class="title-row">
        <h1 class="title" id="title" aria-label="AI 新鲜事"></h1>
        <button class="date-btn" id="date-btn" type="button" aria-haspopup="dialog" hidden>
          <span id="date-btn-text"></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
      </div>
      <p class="subtitle" id="subtitle">&nbsp;</p>
      <nav class="tabs" id="tabs" aria-label="视图">
        <a href="#" id="tab-daily"><svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h10A1.5 1.5 0 0 1 17 5.5V19a1 1 0 0 0 1 1H6a2 2 0 0 1-2-2z"/><path d="M17 9h2a1 1 0 0 1 1 1v8a2 2 0 0 1-2 2"/><path d="M8 8h5M8 12h5M8 16h3"/></svg><span>精选日报</span></a>
        <a href="#hot" id="tab-hot"><svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c.5 3.5 5 5.5 5 10.5a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5.3 1.6 1.2 2.6 2.2 3C10.6 9.5 11 6 12 3z"/></svg><span>实时热点</span></a>
        <a href="#design" id="tab-design"><svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.8-.8 1.8-1.7 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-.9.8-1.7 1.7-1.7H16a5 5 0 0 0 5-5c0-3.9-4-7.2-9-7.2z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10.5" cy="7.5" r="1"/><circle cx="15" cy="8" r="1"/></svg><span>设计</span></a>
        <a href="#tools" id="tab-tools"><svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg><span>工具库</span></a>
      </nav>
    </header>
    <div id="content"></div>
  </main>
</div>

<script>
(function () {
  "use strict";

  var CATEGORIES = { model: "模型产品", industry: "行业动态", research: "研究前沿", tools: "工具玩法" };
  var REGIONS = { cn: "国内", intl: "国外" };
  var CORP_KINDS = { layoff: "裁员", quality: "质量召回", penalty: "监管处罚", org: "组织人事", business: "经营", dispute: "争议" };
  var CORP_COLORS = { layoff: "industry", quality: "warn", penalty: "warn", org: "model", business: "research", dispute: "tools" };
  var APP_CATS = { office: "办公", coding: "编程", system: "系统", fun: "娱乐" };
  var APP_COLORS = { office: "model", coding: "research", system: "industry", fun: "tools" };
  var INSIGHT_KINDS = { industry: "行业应用", usage: "怎么用 AI", jobs: "职业变化" };
  var INSIGHT_COLORS = { industry: "model", usage: "research", jobs: "tools" };
  var DESIGN_KINDS = { tool: "设计工具", plugin: "插件", deal: "优惠", trend: "设计动态" };
  var DESIGN_COLORS = { tool: "model", plugin: "research", deal: "warn", trend: "tools" };
  var PRICE_CHANGES = { up: "涨价", down: "降价", new: "新套餐", free: "免费开放", limit: "额度调整" };
  var PRICE_COLORS = { up: "warn", down: "research", new: "model", free: "tools", limit: "industry" };
  var WEEKDAYS = ["日", "一", "二", "三", "四", "五", "六"];

  var state = { dates: [], date: null, category: "all", region: "all", libCat: "all", libQuery: "", designKind: "all", designQuery: "", hotTopic: "all", hotQuery: "", calMonth: null, listLimit: 20 };
  var $dateBtn = document.getElementById("date-btn");
  var $navBtn = document.getElementById("nav-btn");
  var $subtitle = document.getElementById("subtitle");
  var $content = document.getElementById("content");

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    for (var k in attrs || {}) {
      if (k === "text") node.textContent = attrs[k];
      else if (k === "class") node.className = attrs[k];
      else node.setAttribute(k, attrs[k]);
    }
    (children || []).forEach(function (c) { if (c) node.appendChild(c); });
    return node;
  }

  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement("script");
      s.src = src;
      s.onload = function () { resolve(); };
      s.onerror = function () { s.remove(); reject(new Error(src)); };
      document.head.appendChild(s);
    });
  }

  function formatDate(d, long) {
    var p = d.split("-").map(Number);
    var wd = WEEKDAYS[new Date(p[0], p[1] - 1, p[2]).getDay()];
    return (long ? p[0] + " 年 " : "") + p[1] + " 月 " + p[2] + " 日 · 周" + wd;
  }

  function safeUrl(url) {
    return /^https?:\/\//i.test(url || "") ? url : "#";
  }

  function renderTitle() {
    var $t = document.getElementById("title");
    Array.from("AI 新鲜事").forEach(function (ch, i) {
      var s = el("span", { text: ch === " " ? " " : ch, "aria-hidden": "true" });
      s.style.setProperty("--i", i);
      $t.appendChild(s);
    });
  }

  function pad2(n) { return (n < 10 ? "0" : "") + n; }

  function renderDates() {
    // 翻到选中日期所在的月份；没有选中（热点、工具库页）就停在最新一期的月份
    var focus = state.date || state.dates[0];
    if (focus) state.calMonth = focus.slice(0, 7);
    renderCalendar();
    // 手机顶栏的日期按钮，只在日报页出现
    $dateBtn.hidden = !state.date;
    if (state.date) document.getElementById("date-btn-text").textContent = formatDate(state.date).split(" · ")[0];
  }

  // 手机上日期选择是底部抽屉
  function setSheet(open) {
    document.body.classList.toggle("sheet-open", open);
    $dateBtn.setAttribute("aria-expanded", String(open));
  }

  // 手机底部导航：默认收起，记住上次的选择（存不了就每次收起）
  function setNav(open) {
    document.body.classList.toggle("nav-open", open);
    $navBtn.setAttribute("aria-expanded", String(open));
    $navBtn.setAttribute("aria-label", open ? "收起导航" : "显示导航");
    try { localStorage.setItem("nav-open", open ? "1" : "0"); } catch (e) {}
  }

  function initMobile() {
    $dateBtn.addEventListener("click", function () { setSheet(true); });
    document.getElementById("backdrop").addEventListener("click", function () { setSheet(false); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape") setSheet(false); });
    var $top = document.getElementById("to-top");
    function onScroll() { $top.classList.toggle("show", window.scrollY > window.innerHeight * 1.5); }
    window.addEventListener("scroll", onScroll, { passive: true });
    onScroll();
    $top.addEventListener("click", function () { window.scrollTo({ top: 0, behavior: "smooth" }); });
    $navBtn.addEventListener("click", function () { setNav(!document.body.classList.contains("nav-open")); });
    var saved = null;
    try { saved = localStorage.getItem("nav-open"); } catch (e) {}
    setNav(saved === "1");
    // 再点一下当前所在的导航，回到顶部（和手机 App 的习惯一致）
    Array.from(document.querySelectorAll(".tabs a")).forEach(function (a) {
      a.addEventListener("click", function (e) {
        if (a.getAttribute("href") !== (location.hash || "#")) return;
        e.preventDefault();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    });
  }

  function renderCalendar() {
    var $cal = document.getElementById("cal");
    $cal.textContent = "";
    if (!state.calMonth) return;
    var has = {};
    state.dates.forEach(function (d) { has[d] = true; });
    var months = state.dates.map(function (d) { return d.slice(0, 7); });
    var first = months[months.length - 1], last = months[0];
    var p = state.calMonth.split("-").map(Number);

    function shift(step) {
      var m = new Date(p[0], p[1] - 1 + step, 1);
      state.calMonth = m.getFullYear() + "-" + pad2(m.getMonth() + 1);
      renderCalendar();
    }
    var prev = el("button", { class: "cal-nav", type: "button", "aria-label": "上个月", text: "‹" });
    var next = el("button", { class: "cal-nav", type: "button", "aria-label": "下个月", text: "›" });
    prev.disabled = state.calMonth <= first;
    next.disabled = state.calMonth >= last;
    prev.addEventListener("click", function () { shift(-1); });
    next.addEventListener("click", function () { shift(1); });
    $cal.appendChild(el("div", { class: "cal-head" }, [
      prev, el("span", { class: "cal-title", text: p[0] + " 年 " + p[1] + " 月" }), next
    ]));

    var grid = el("div", { class: "cal-grid" });
    // 周一开头
    ["一", "二", "三", "四", "五", "六", "日"].forEach(function (w) { grid.appendChild(el("span", { class: "cal-wd", text: w })); });
    var lead = (new Date(p[0], p[1] - 1, 1).getDay() + 6) % 7;
    for (var i = 0; i < lead; i++) grid.appendChild(el("span"));
    var now = new Date();
    var today = now.getFullYear() + "-" + pad2(now.getMonth() + 1) + "-" + pad2(now.getDate());
    var days = new Date(p[0], p[1], 0).getDate();
    for (var day = 1; day <= days; day++) {
      var d = state.calMonth + "-" + pad2(day);
      var cell = has[d]
        ? el("a", { class: "cal-day", href: "#" + d, title: formatDate(d), text: String(day) })
        : el("span", { class: "cal-day", text: String(day) });
      if (d === today) cell.classList.add("today");
      if (d === state.date) cell.setAttribute("aria-current", "true");
      grid.appendChild(cell);
    }
    // 手机上选完日期就收起抽屉
    grid.addEventListener("click", function (e) {
      if (e.target.closest("a")) setSheet(false);
    });
    $cal.appendChild(grid);
    var count = months.filter(function (m) { return m === state.calMonth; }).length;
    $cal.appendChild(el("p", { class: "cal-foot", text: "本月 " + count + " 期 · 共 " + state.dates.length + " 期" }));
  }

  function notice(html) {
    $content.innerHTML = "";
    var n = el("div", { class: "notice" });
    n.innerHTML = html;
    $content.appendChild(n);
  }

  function chipGroup(name, options, current, onPick) {
    var group = el("div", { class: "chip-group", role: "group", "aria-label": name });
    Object.keys(options).forEach(function (key) {
      var b = el("button", { class: "chip", type: "button", "aria-pressed": String(key === current), text: options[key] });
      b.addEventListener("click", function () {
        Array.from(group.children).forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
        onPick(key);
      });
      group.appendChild(b);
    });
    return group;
  }

  function tag(text, color, cls) {
    var t = el("span", { class: "tag " + (cls || "kind"), text: text });
    if (color) t.style.setProperty("--c", "var(--c-" + color + ")");
    return t;
  }

  function extLink(url, text) {
    return el("a", { href: safeUrl(url), target: "_blank", rel: "noopener noreferrer", text: text });
  }

  // 通用卡片：opts = { tags: [节点], title, url, body, foot: 节点 }
  function card(opts, i, animate) {
    var c = el("article", { class: "card" }, [
      el("div", { class: "tags" }, opts.tags),
      el("h3", {}, [extLink(opts.url, opts.title)]),
      opts.body ? el("p", { text: opts.body }) : null,
      opts.foot
    ]);
    c.style.setProperty("--i", i);
    if (!animate) c.style.animation = "none", c.style.opacity = 1, c.style.transform = "none";
    c.addEventListener("pointermove", function (e) {
      var r = c.getBoundingClientRect();
      c.style.setProperty("--mx", e.clientX - r.left + "px");
      c.style.setProperty("--my", e.clientY - r.top + "px");
    });
    return c;
  }

  function sourceLine(prefix, source, url) {
    return el("div", { class: "source" }, [document.createTextNode(prefix), extLink(url, source + " ↗")]);
  }

  function formatStars(n) {
    if (typeof n !== "number") return "";
    return "★ " + (n >= 10000 ? (n / 10000).toFixed(1).replace(/\.0$/, "") + " 万" : String(n));
  }

  function section(title, count, desc, body) {
    return el("section", { class: "section" }, [
      el("div", { class: "section-head" }, [el("h2", { text: title }), count ? el("span", { text: count }) : null]),
      desc ? el("p", { class: "section-desc", text: desc }) : null,
      body
    ]);
  }

  function newsCard(it, i, animate) {
    return card({
      tags: [tag(CATEGORIES[it.category] || it.category, it.category, "cat"), tag(REGIONS[it.region] || it.region, null, "region")],
      title: it.title, url: it.url, body: it.summary,
      foot: sourceLine("来源：", it.source, it.url)
    }, i, animate);
  }

  function appCard(a, i, animate) {
    var meta = [a.license, formatStars(a.stars), a.size].filter(Boolean);
    return card({
      tags: [tag(APP_CATS[a.category] || a.category, APP_COLORS[a.category])],
      title: a.name, url: a.url, body: a.desc,
      foot: el("div", { class: "meta source" }, meta.map(function (m) { return el("span", { text: m }); }))
    }, i, animate);
  }

  function designCard(d, i, animate) {
    var tags = [tag(DESIGN_KINDS[d.kind] || d.kind, DESIGN_COLORS[d.kind])];
    if (d.price) tags.push(tag(d.price, null, "region"));
    if (d.stars !== undefined) tags.push(tag(formatStars(d.stars), null, "region"));
    return card({ tags: tags, title: d.title, url: d.url, body: d.summary, foot: sourceLine("来源：", d.source, d.url) }, i, animate);
  }

  function renderNews(issue, $box, animate) {
    var items = issue.items.filter(function (it) {
      return (state.category === "all" || it.category === state.category) &&
             (state.region === "all" || it.region === state.region);
    });
    $box.textContent = "";
    $box.appendChild(el("p", { class: "count", text: "显示 " + items.length + " / " + issue.items.length + " 条" }));
    if (!items.length) {
      $box.appendChild(el("div", { class: "notice", text: "这个筛选组合下没有新闻，换一个试试。" }));
      return;
    }
    var grid = el("div", { class: "grid" });
    items.forEach(function (it, i) { grid.appendChild(newsCard(it, i, animate)); });
    $box.appendChild(grid);
  }

  function renderIssue() {
    var issue = (window.AI_DAILY || {})[state.date];
    $content.innerHTML = "";
    $subtitle.textContent = formatDate(state.date, true) + " · 共 " + issue.items.length + " 条新闻";

    var ol = el("ol");
    (issue.highlights || []).forEach(function (h) { ol.appendChild(el("li", { text: h })); });
    $content.appendChild(el("section", { class: "highlights" }, [el("p", { class: "shiny", text: "今日看点" }), ol]));

    var catOpts = { all: "全部" }, regOpts = { all: "全部", cn: "国内", intl: "国外" };
    Object.keys(CATEGORIES).forEach(function (k) { catOpts[k] = CATEGORIES[k]; });
    var $news = el("div");
    $content.appendChild(section("AI 新闻", issue.items.length + " 条", "", el("div", {}, [
      el("div", { class: "filters" }, [
        chipGroup("分类", catOpts, state.category, function (k) { state.category = k; renderNews(issue, $news, false); }),
        chipGroup("地区", regOpts, state.region, function (k) { state.region = k; renderNews(issue, $news, false); })
      ]),
      $news
    ])));
    renderNews(issue, $news, true);

    if (issue.voices && issue.voices.length) {
      var vg = el("div", { class: "grid" });
      issue.voices.forEach(function (v, i) {
        vg.appendChild(card({
          tags: [tag(v.person, "model"), tag(v.region === "cn" ? "国内" : "国外", null, "region"), tag(v.role, null, "region"), tag(formatDate(v.said), null, "region")],
          title: v.title, url: v.url, body: v.summary,
          foot: sourceLine("出处：", v.source, v.url)
        }, i, true));
      });
      $content.appendChild(section("大佬观点", issue.voices.length + " 条", "国内外 AI 领域人物最近公开说了什么，都附原始出处。", vg));
    }

    if (issue.pricing && issue.pricing.length) {
      var pg = el("div", { class: "grid" });
      issue.pricing.forEach(function (p, i) {
        pg.appendChild(card({
          tags: [tag(PRICE_CHANGES[p.change] || p.change, PRICE_COLORS[p.change]), tag(p.product, null, "region")],
          title: p.title, url: p.url, body: p.summary,
          foot: sourceLine("来源：", p.source, p.url)
        }, i, true));
      });
      $content.appendChild(section("AI 价格动态", issue.pricing.length + " 条", "ChatGPT、Claude、Gemini、Grok 及国产大模型的订阅和 API 价格、额度变化（近两周）。", pg));
    }

    if (issue.corp && issue.corp.length) {
      var list = el("div", { class: "corp-list" });
      issue.corp.forEach(function (c, i) {
        list.appendChild(card({
          tags: [tag(CORP_KINDS[c.kind] || c.kind, CORP_COLORS[c.kind]), tag(c.region === "intl" ? "国外" : "国内", null, "region"), tag(c.company, null, "region")],
          title: c.title, url: c.url, body: c.summary,
          foot: sourceLine("来源：", c.source, c.url)
        }, i, true));
      });
      $content.appendChild(section("大厂动态", issue.corp.length + " 条", "国内外大企业的裁员、质量问题、处罚、人事和经营变化，不限于 AI。", list));
    }

    if (issue.design && issue.design.length) {
      var dg = el("div", { class: "grid" });
      issue.design.forEach(function (d, i) { dg.appendChild(designCard(d, i, true)); });
      $content.appendChild(section("设计专栏", issue.design.length + " 条", "给 UI / 设计同学：新设计工具、Figma 和 VS Code 插件、优惠信息、设计圈动态。", dg));
    }

    if (issue.apps && issue.apps.length) {
      var grid = el("div", { class: "app-grid" });
      issue.apps.forEach(function (a, i) { grid.appendChild(appCard(a, i, true)); });
      $content.appendChild(section("工具推荐", issue.apps.length + " 个", "好用、免费的 Windows 软件，往期推荐的都收在“工具库”里。", grid));
    }

    if (issue.insights && issue.insights.length) {
      var ig = el("div", { class: "grid" });
      issue.insights.forEach(function (it, i) {
        ig.appendChild(card({
          tags: [tag(INSIGHT_KINDS[it.kind] || it.kind, INSIGHT_COLORS[it.kind]), tag("数据时间 " + it.asOf, null, "region")],
          title: it.title, url: it.url, body: it.summary,
          foot: sourceLine("来源：", it.source, it.url)
        }, i, true));
      });
      $content.appendChild(section("AI 落地观察", issue.insights.length + " 条", "哪些行业在用 AI、怎么用、催生了哪些新职业。", ig));
    }

    // 版块导航：版块多，往下的内容不容易发现，点一下滚动到对应版块
    var jump = el("nav", { class: "jump", "aria-label": "版块导航" }, [el("span", { class: "jump-label", text: "跳到" })]);
    Array.from($content.querySelectorAll(".section")).forEach(function (sec) {
      var name = sec.querySelector("h2").textContent;
      var b = el("button", { class: "chip", type: "button", text: name });
      b.addEventListener("click", function () { sec.scrollIntoView({ behavior: "smooth", block: "start" }); });
      jump.appendChild(b);
    });
    $content.insertBefore(jump, $content.querySelector(".highlights").nextSibling);
  }

  // 往期文件写好就不再改，让浏览器缓存；只有最新一期可能当天重写，加时间戳
  function issueSrc(date) {
    return "data/" + date + ".js" + (date === state.dates[0] ? "?t=" + Date.now() : "");
  }

  function loadIssue(date) {
    if ((window.AI_DAILY || {})[date]) return Promise.resolve(true);
    return loadScript(issueSrc(date)).then(function () { return !!(window.AI_DAILY || {})[date]; }, function () { return false; });
  }

  // 设计、工具库：按推荐日期分组，一次显示 PAGE 条，底部按钮再加载
  var PAGE = 20;

  function renderGroups($list, shown, gridClass, unit, makeCard, redraw) {
    var total = {};
    shown.forEach(function (x) { total[x.date] = (total[x.date] || 0) + 1; });
    var grid = null, last = null;
    shown.slice(0, state.listLimit).forEach(function (x, i) {
      if (x.date !== last) {
        last = x.date;
        var head = el("h3", { class: "group-head" }, [
          el("span", { text: formatDate(x.date) }),
          el("span", { class: "group-count", text: total[x.date] + " " + unit })
        ]);
        if (x.date === state.dates[0]) head.insertBefore(el("span", { class: "group-new", text: "最新" }), head.firstChild);
        grid = el("div", { class: gridClass });
        $list.appendChild(head);
        $list.appendChild(grid);
      }
      grid.appendChild(makeCard(x, i % PAGE));
    });
    var rest = shown.length - state.listLimit;
    if (rest <= 0) return;
    var more = el("button", { class: "load-more", type: "button", text: "再看 " + Math.min(rest, PAGE) + " " + unit + "（还有 " + rest + " " + unit + "）" });
    more.addEventListener("click", function () {
      state.listLimit += PAGE;
      // 重画后保持滚动位置，新加载的卡片接在原来的位置后面
      var y = window.scrollY;
      redraw();
      window.scrollTo(0, y);
    });
    $list.appendChild(more);
  }

  function renderLibrary(apps) {
    var $list = el("div");
    state.listLimit = PAGE;
    function draw(animate) {
      var q = state.libQuery.trim().toLowerCase();
      var shown = apps.filter(function (x) {
        var a = x.app;
        return (state.libCat === "all" || a.category === state.libCat) &&
               (!q || (a.name + " " + a.desc).toLowerCase().indexOf(q) >= 0);
      });
      $list.textContent = "";
      $list.appendChild(el("p", { class: "count", text: "显示 " + shown.length + " / " + apps.length + " 个" }));
      if (!shown.length) { $list.appendChild(el("div", { class: "notice", text: "没有符合条件的工具。" })); return; }
      renderGroups($list, shown, "app-grid", "个", function (x, i) { return appCard(x.app, i, animate); }, function () { draw(false); });
    }
    var catOpts = { all: "全部" };
    Object.keys(APP_CATS).forEach(function (k) { catOpts[k] = APP_CATS[k]; });
    var search = el("input", { class: "search", type: "search", placeholder: "搜索工具名或用途", "aria-label": "搜索工具" });
    search.value = state.libQuery;
    search.addEventListener("input", function () { state.libQuery = search.value; state.listLimit = PAGE; draw(false); });
    $content.innerHTML = "";
    $content.appendChild(el("div", { class: "lib-tools" }, [
      chipGroup("工具分类", catOpts, state.libCat, function (k) { state.libCat = k; state.listLimit = PAGE; draw(false); }),
      search
    ]));
    $content.appendChild($list);
    draw(true);
  }

  function showLibrary() {
    $subtitle.textContent = "工具库 · 往期推荐过的所有工具";
    notice("加载中…");
    Promise.all(state.dates.map(loadIssue)).then(function () {
      if (location.hash !== "#tools") return;
      var apps = [], seen = {};
      // manifest 从新到旧，倒过来遍历，记下每个工具第一次被推荐的日期
      state.dates.slice().reverse().forEach(function (d) {
        var issue = (window.AI_DAILY || {})[d];
        ((issue && issue.apps) || []).forEach(function (a) {
          var key = a.name.trim().toLowerCase();
          if (!seen[key]) { seen[key] = true; apps.push({ app: a, date: d }); }
        });
      });
      // 新的日期在前，同一天内保持原有顺序（sort 是稳定排序）
      apps.sort(function (x, y) { return x.date < y.date ? 1 : x.date > y.date ? -1 : 0; });
      $subtitle.textContent = "工具库 · 共 " + apps.length + " 个";
      if (!apps.length) notice("还没有推荐过工具。");
      else renderLibrary(apps);
    });
  }

  // ---------- 设计 ----------

  function renderDesign(list) {
    var $list = el("div");
    state.listLimit = PAGE;
    function draw(animate) {
      var q = state.designQuery.trim().toLowerCase();
      var shown = list.filter(function (x) {
        var d = x.item;
        return (state.designKind === "all" || d.kind === state.designKind) &&
               (!q || (d.title + " " + d.summary + " " + (d.price || "")).toLowerCase().indexOf(q) >= 0);
      });
      $list.textContent = "";
      $list.appendChild(el("p", { class: "count", text: "显示 " + shown.length + " / " + list.length + " 条" }));
      if (!shown.length) { $list.appendChild(el("div", { class: "notice", text: "没有符合条件的内容。" })); return; }
      renderGroups($list, shown, "grid", "条", function (x, i) { return designCard(x.item, i, animate); }, function () { draw(false); });
    }
    var kindOpts = { all: "全部" };
    Object.keys(DESIGN_KINDS).forEach(function (k) { kindOpts[k] = DESIGN_KINDS[k]; });
    var search = el("input", { class: "search", type: "search", placeholder: "搜索工具、插件、优惠", "aria-label": "搜索设计内容" });
    search.value = state.designQuery;
    search.addEventListener("input", function () { state.designQuery = search.value; state.listLimit = PAGE; draw(false); });
    $content.innerHTML = "";
    $content.appendChild(el("div", { class: "lib-tools" }, [
      chipGroup("设计分类", kindOpts, state.designKind, function (k) { state.designKind = k; state.listLimit = PAGE; draw(false); }),
      search
    ]));
    $content.appendChild($list);
    draw(true);
  }

  function showDesign() {
    $subtitle.textContent = "设计 · 往期设计专栏汇总";
    notice("加载中…");
    Promise.all(state.dates.map(loadIssue)).then(function () {
      if (location.hash !== "#design") return;
      // manifest 从新到旧；同一链接只保留最新一期的那条
      var list = [], seen = {};
      state.dates.forEach(function (d) {
        var issue = (window.AI_DAILY || {})[d];
        ((issue && issue.design) || []).forEach(function (it) {
          if (seen[it.url]) return;
          seen[it.url] = true;
          list.push({ item: it, date: d });
        });
      });
      $subtitle.textContent = "设计 · 共 " + list.length + " 条";
      if (!list.length) notice("还没有设计专栏内容。");
      else renderDesign(list);
    });
  }

  // ---------- 实时热点 ----------
  var TOPIC_COLORS = { ai: "model", bigtech: "industry", risk: "warn", money: "research", chip: "tools" };
  var HOT_SECTIONS = [
    { kind: "hot", title: "国内热榜", desc: "各大热榜里命中关注词的条目，按热度从高到低混排；来源后面是它在原榜单的名次。" },
    { kind: "news", title: "AI 资讯", desc: "国内外 AI 媒体和官方博客 48 小时内的文章，按时间排列。" },
    { kind: "repo", title: "GitHub 本周新项目", desc: "最近 7 天新建、Star 最多的仓库。" }
  ];
  var HOT_PAGE = 20;

  function timeAgo(iso) {
    var m = Math.round((Date.now() - Date.parse(iso)) / 60000);
    if (isNaN(m)) return "";
    if (m < 1) return "刚刚";
    if (m < 60) return m + " 分钟前";
    if (m < 48 * 60) return Math.round(m / 60) + " 小时前";
    return Math.round(m / 1440) + " 天前";
  }

  // 英文内容的中文翻译（data/title-zh.js，键是原文链接）；没有翻译时返回空
  function zhTitle(it) {
    return it.kind === "news" && window.AI_TITLE_ZH ? window.AI_TITLE_ZH[it.url] || "" : "";
  }
  function zhDesc(it) {
    return window.AI_DESC_ZH ? window.AI_DESC_ZH[it.url] || "" : "";
  }

  function hotRow(it, i, names, topicNames) {
    var srcName = names[it.source] || it.source;
    var zh = zhTitle(it), desc = zhDesc(it) || it.desc;
    var link = extLink(it.url, zh || it.title);
    if (zh) link.title = "原文：" + it.title;
    var sub = [el("span", { text: it.kind === "hot" ? srcName + " 第 " + it.rank + " 位" : srcName })];
    if (it.kind === "news") sub.push(el("span", { text: (it.region === "cn" ? "国内 · " : "国外 · ") + timeAgo(it.time) }));
    if (it.kind === "repo") sub.push(el("span", { text: [formatStars(it.stars), it.lang].filter(Boolean).join(" · ") }));
    (it.topics || []).forEach(function (t) { sub.push(tag(topicNames[t] || t, TOPIC_COLORS[t])); });
    return el("li", { class: "hot-row" }, [
      el("span", { class: "hot-rank", text: String(i + 1) }),
      link,
      el("div", { class: "hot-sub" }, sub),
      desc ? el("p", { class: "hot-desc", text: desc }) : null
    ]);
  }

  // 一个分区：列表先显示 HOT_PAGE 条，底部按钮每次再加 HOT_PAGE 条
  function hotList(items, names, topicNames) {
    var ul = el("ul", { class: "hot-list" });
    var box = el("div", { class: "hot-box" }, [ul]);
    var shown = 0;
    var btn = el("button", { class: "more", type: "button" });
    function more() {
      items.slice(shown, shown + HOT_PAGE).forEach(function (it, i) { ul.appendChild(hotRow(it, shown + i, names, topicNames)); });
      shown = Math.min(items.length, shown + HOT_PAGE);
      if (shown >= items.length) btn.remove();
      else btn.textContent = "再显示 " + Math.min(HOT_PAGE, items.length - shown) + " 条";
    }
    btn.addEventListener("click", more);
    box.appendChild(btn);
    more();
    return box;
  }

  function renderHot(hot) {
    var names = {}, topicNames = {};
    var totals = {};
    hot.sources.forEach(function (s) { names[s.id] = s.name; totals[s.id] = s.total; });
    hot.topics.forEach(function (t) { topicNames[t.id] = t.name; });
    var ok = hot.sources.filter(function (s) { return s.ok; }).length;
    $subtitle.textContent = "实时热点 · " + timeAgo(hot.generatedAt) + "更新 · " + ok + "/" + hot.sources.length + " 个数据源正常";

    var $lists = el("div");
    function draw() {
      var q = state.hotQuery.trim().toLowerCase();
      $lists.textContent = "";
      HOT_SECTIONS.forEach(function (sec) {
        var items = hot.items.filter(function (it) {
          return it.kind === sec.kind &&
            (state.hotTopic === "all" || (it.topics || []).indexOf(state.hotTopic) >= 0) &&
            (!q || (it.title + " " + zhTitle(it) + " " + (it.desc || "") + " " + zhDesc(it)).toLowerCase().indexOf(q) >= 0);
        });
        // 各榜单长度不同，用“名次 ÷ 榜单总条数”比较热度，名次相对越靠前越热
        if (sec.kind === "hot") items.sort(function (a, b) { return a.rank / (totals[a.source] || 50) - b.rank / (totals[b.source] || 50); });
        if (sec.kind === "news") items.sort(function (a, b) { return a.time < b.time ? 1 : a.time > b.time ? -1 : 0; });
        if (sec.kind === "repo") items.sort(function (a, b) { return b.stars - a.stars; });
        var body = items.length ? hotList(items, names, topicNames) : el("div", { class: "notice", text: "没有符合条件的条目。" });
        $lists.appendChild(section(sec.title, items.length + " 条", sec.desc, body));
      });
    }

    var topicOpts = { all: "全部" };
    hot.topics.forEach(function (t) { topicOpts[t.id] = t.name; });
    var search = el("input", { class: "search", type: "search", placeholder: "搜索标题", "aria-label": "搜索热点" });
    search.value = state.hotQuery;
    search.addEventListener("input", function () { state.hotQuery = search.value; draw(); });

    var failed = hot.sources.filter(function (s) { return !s.ok; });
    var status = el("details", { class: "status" }, [
      el("summary", { text: "数据源状态：" + ok + " 个正常" + (failed.length ? "，" + failed.length + " 个失败" : "") }),
      el("ul", {}, hot.sources.map(function (s) {
        return el("li", { text: s.name + "：" + (s.ok ? "收录 " + s.count + " / 共 " + s.total : "失败（" + s.error + "）") });
      }))
    ]);

    $content.innerHTML = "";
    $content.appendChild(el("div", { class: "lib-tools" }, [
      chipGroup("关注分组", topicOpts, state.hotTopic, function (k) { state.hotTopic = k; draw(); }),
      search
    ]));
    $content.appendChild($lists);
    $content.appendChild(status);
    draw();
  }

  function showHot() {
    $subtitle.textContent = "实时热点";
    notice("加载中…");
    // 加时间戳，避免浏览器用缓存的旧数据
    // 中文标题对照表可以没有，加载失败不影响热点显示
    var zh = loadScript("data/title-zh.js?t=" + Date.now()).catch(function () {});
    var data = loadScript("data/hot.js?t=" + Date.now());
    Promise.all([data, zh]).then(function () {
      if (location.hash !== "#hot") return;
      if (window.AI_HOT && window.AI_HOT.items) renderHot(window.AI_HOT);
      else notice("<code>data/hot.js</code> 里没有数据。");
    }, function () {
      if (location.hash === "#hot") notice("还没有实时热点数据。运行 <code>node scripts/crawl.mjs</code> 抓取一次；部署到 GitHub 后会定时自动更新。");
    });
  }

  function setTabs(view) {
    ["daily", "hot", "design", "tools"].forEach(function (v) {
      document.getElementById("tab-" + v).setAttribute("aria-current", String(v === view));
    });
  }

  function show() {
    var wanted = decodeURIComponent(location.hash.slice(1));
    if (wanted === "tools" || wanted === "hot" || wanted === "design") {
      setTabs(wanted);
      state.date = null;
      renderDates();
      if (wanted === "tools") showLibrary();
      else if (wanted === "design") showDesign();
      else showHot();
      return;
    }
    setTabs("daily");
    if (!state.dates.length) {
      $subtitle.textContent = "";
      notice("还没有日报。在 Claude Code 里运行 <code>/ai日报</code> 生成第一期。");
      return;
    }
    state.date = state.dates.indexOf(wanted) >= 0 ? wanted : state.dates[0];
    renderDates();
    if ((window.AI_DAILY || {})[state.date]) { renderIssue(true); return; }
    $subtitle.textContent = formatDate(state.date, true);
    notice("加载中…");
    var date = state.date;
    loadScript(issueSrc(date)).then(function () {
      if (date !== state.date) return;
      if ((window.AI_DAILY || {})[date]) renderIssue(true);
      else notice("<code>data/" + date + ".js</code> 里没有这一天的数据。");
    }, function () {
      if (date === state.date) notice("这一期的数据文件 <code>data/" + date + ".js</code> 加载失败，可以切换到其他日期。");
    });
  }

  renderTitle();
  initMobile();
  loadScript("data/manifest.js?t=" + Date.now()).catch(function () {}).then(function () {
    var m = window.AI_DAILY_MANIFEST;
    state.dates = Array.isArray(m) ? m.slice() : [];
    window.addEventListener("hashchange", show);
    show();
  });
})();
</script>
</body>
</html>
