name: 抓取热点并发布网站

# 每 3 小时抓一次实时热点；推送新日报（push 到 main）时也会重新发布。
# 网站只发布到 Cloudflare Pages（https://aifresh.pages.dev）。
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 把抓到的 data/hot.js 提交回仓库
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 运行测试
        run: node --test "scripts/**/*.test.mjs"

      - name: 校验所有日报数据
        run: for f in data/20*.js; do node scripts/validate.mjs "$f" || exit 1; done

      - name: 抓取实时热点
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/crawl.mjs || echo "抓取失败，沿用上一次的数据"

      # 用 Cloudflare Workers AI 翻译新出现的英文标题和简介；失败时页面照常显示英文
      - name: 翻译英文内容
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/translate.mjs

      - name: 提交热点数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/hot.js data/title-zh.js
          if git diff --staged --quiet; then
            echo "热点数据没有变化"
          else
            git commit -m "chore: 更新实时热点 [skip ci]"
            git pull --rebase && git push || echo "提交失败，下次再试"
          fi

      - name: 准备网站文件
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r data _site/

      # 需要在仓库 Settings → Secrets 里配好 CLOUDFLARE_API_TOKEN 和 CLOUDFLARE_ACCOUNT_ID。
      # 这是唯一的发布渠道，没配密钥或发布失败都让任务报错，免得网站悄悄停更。
      - name: 发布到 Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "没配 Cloudflare 密钥，无法发布"
            exit 1
          fi
          npx --yes wrangler@4 pages deploy _site --project-name=aifresh --branch=main
